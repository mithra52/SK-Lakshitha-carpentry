<!DOCTYPE html>
<html>
<head>
<title>New Order Form</title>

<style>

body{
    background-color:white;
    color:black;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
}

.container{
    width:80%;
    margin:50px auto;
    padding:40px;
    background-color:white;
}

h1{
    margin-bottom:30px;
}

.form-row{
    display:flex;
    gap:40px;
}

.column{
    width:33%;
}

label{
    display:block;
    margin-bottom:5px;
    color:black;
    font-size:14px;
}

.required{
    color:red;
}

input{
    width:100%;
    padding:6px;
    margin-bottom:10px;
    box-sizing:border-box;
}

.error{
    color:red;
    font-size:12px;
    display:block;
    margin-top:-5px;
    margin-bottom:10px;
}

.button-area{
    text-align:center;
    margin-top:30px;
}

.save-btn{
    background-color:white;
    color:black;
    padding:6px 18px;
    margin-right:15px;
}

.cancel-btn{
    background-color:blue;
    color:white;
    padding:6px 18px;
}

</style>
</head>

<body>

<div class="container">

<h1>New Order</h1>

<form>

<div class="form-row">

<!-- Column 1 -->
<div class="column">

<label>
Subscription Name<span class="required">*</span>
</label>
<input type="text">

<label>
Discounted Price(₹)<span class="required">*</span>
</label>
<input type="text">

<label>
Tax Rate<span class="required">*</span>
</label>
<input type="text">

<span class="error">
This field is required
</span>

<label>
License Valid Till<span class="required">*</span>
</label>
<input type="date">

<label>
Payment Status
</label>
<input type="text">

</div>

<!-- Column 2 -->
<div class="column">

<label>
Subscription Fees<span class="required">*</span>
</label>
<input type="text">

<label>
License Quantity<span class="required">*</span>
</label>
<input type="text">

<label>
Tax Amount(₹)<span class="required">*</span>
</label>
<input type="text">

<label>
Sales Person
</label>
<input type="text">

<label>
Payment Reference
</label>
<input type="text">

</div>

<!-- Column 3 -->
<div class="column">

<label>
Coupon Name<span class="required">*</span>
</label>
<input type="text">

<label>
Total Order Value(₹)<span class="required">*</span>
</label>
<input type="text">

<label>
Net Order Value Ex GST(₹)<span class="required">*</span>
</label>
<input type="text">

<label>
Order Remarks
</label>
<input type="text">

<label>
Payment Date
</label>
<input type="date">

</div>

</div>

<br>

<div class="button-area">

<input
type="submit"
value="Save"
class="save-btn">

<input
type="button"
value="Cancel"
class="cancel-btn">

</div>

</form>

</div>

</body>
</html>
