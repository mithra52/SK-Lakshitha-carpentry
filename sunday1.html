<!DOCTYPE html>
<html>
<head>
<title>Slipper Product</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    padding:40px;
}

.main{
    display:flex;
    gap:50px;
}

.image img{
    width:450px;
}

.details{
    width:600px;
}

.small-title{
    color:black;
    font-size:20px;
}

h1{
    font-size:55px;
    color:black;
    margin:20px 0;
}

.price{
    font-size:50px;
    font-weight:bold;
    color:black;
    margin-bottom:20px;
}

p{
    font-size:22px;
    line-height:1.5;
}

.colors{
    margin-top:30px;
}

.color{
    width:35px;
    height:35px;
    display:inline-block;
    border-radius:50%;
    margin-right:10px;
}

.pink{
    background:pink;
}

.black{
    background:black;
}

.blue{
    background:blue;
}

.size{
    margin-top:40px;
}

.size button{
    width:60px;
    height:60px;
    margin-right:10px;
    font-size:22px;
}

.cart{
    margin-top:40px;
}

.cart button{
    width:250px;
    height:60px;
    font-size:24px;
}
</style>

</head>

<body>

<div class="main">

    <div class="image">
        <img src="./slip.jpg" alt="Slip.jpg">
    </div>

    <div class="details">

        <div class="small-title">Women's Pink Slipper</div>

        <h1>Ladies Pink Slipper</h1>

        <div class="price">$45</div>

        <p>
            Soft and comfortable ladies pink slipper.
            Perfect for indoor use and daily comfort.
            elegant model style slipper for girls ,most trending.
        </p>

        <div class="colors">
            <h3>Colors</h3><br>
            <span class="color pink"></span>
            <span class="color black"></span>
            <span class="color blue"></span>
        </div>

        <div class="size">
            <h3>Choose Size</h3><br>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
        </div>

        <div class="cart">
            <button>ADD TO CART</button>
        </div>

    </div>

</div>

</body>
</html>
